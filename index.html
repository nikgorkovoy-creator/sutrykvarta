<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stone Study</title><style>
:root{--bg:#f5f3ed;--ink:#27281f;--muted:#77786d;--green:#4a614b;--line:#e5e1d7;--gold:#c89c55}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:880px;margin:auto;padding:30px 22px 55px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:13px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.score{font-size:13px;color:var(--muted)}.track{height:4px;background:#e6e2d8;border-radius:8px;margin:17px 0 32px;overflow:hidden}.track span{height:100%;display:block;background:#849277;width:0;transition:width .25s}h1{font:500 clamp(34px,6vw,48px)/1.1 Georgia,serif;letter-spacing:-.035em;margin:0 0 10px}h2{font:500 25px/1.2 Georgia,serif;margin:0 0 18px}.lead{margin:0;color:var(--muted)}.game{max-width:560px;margin:30px auto 0}.card,.setup{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 18px 44px #302d1d0d}[hidden]{display:none!important}.setup-body{padding:25px}.choice{display:flex;align-items:center;gap:11px;padding:13px 14px;border:1px solid var(--line);border-radius:11px;margin:9px 0;cursor:pointer}.choice:has(input:checked){border-color:#8b9a7d;background:#f8f8f3}.choice input,.stone-choice input{accent-color:var(--green);width:17px;height:17px;flex:none}.pick-panel{margin-top:18px}.pick-title{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:700}.pick-actions{display:flex;gap:14px}.stone-list{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;max-height:235px;overflow:auto;border:1px solid var(--line);border-radius:11px;padding:10px;margin-top:8px}.stone-choice{display:flex;align-items:center;gap:8px;padding:6px 3px;font-size:14px;cursor:pointer}.start-button{width:100%;height:46px;margin-top:15px}input[type=text]{min-width:0;flex:1;padding:13px 14px;border:1px solid #d8d5ca;border-radius:10px;font:inherit;outline:0}input[type=text]:focus{border-color:var(--green);box-shadow:0 0 0 3px #4a614b18}button{font:600 14px system-ui;cursor:pointer;border:0;border-radius:10px;background:var(--green);color:white;padding:0 19px}button:hover{background:#384d3a}button:disabled{opacity:.55;cursor:default}.error{min-height:21px;color:#ad503b;font-size:13px;margin:9px 0 0}.image-wrap{height:280px;background:#eee9dd;display:grid;place-items:center;padding:14px;overflow:hidden}.image-wrap img{width:auto;height:auto;max-width:360px;max-height:190px;object-fit:contain;border-radius:9px;transform:scale(1.3);image-rendering:auto}.body{padding:22px 24px 4px}.label{font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#999584}.form{display:flex;gap:10px;margin-top:12px}.feedback{min-height:50px;padding-top:13px;font-size:14px}.ok{color:#31704c}.no{color:#ad503b}.answer{font-weight:750;color:var(--ink)}.actions{padding:0 24px 20px;display:flex;align-items:center;justify-content:space-between}.quiet{background:none;color:var(--muted);padding:8px 0}.quiet:hover{background:none;color:var(--ink)}.hint{font-size:12px;color:#a4a195}.foot{text-align:center;color:#aaa696;font-size:12px;margin-top:17px}.done{text-align:center;padding:35px 24px}.done h2{margin-bottom:7px}.done p{color:var(--muted);margin:0 0 18px}.done button{padding:13px 20px}@media(max-width:600px){.wrap{padding:22px 15px}.setup-body{padding:19px}.image-wrap{height:250px}.image-wrap img{max-width:300px;max-height:170px}.body{padding:18px 18px 3px}.actions{padding:0 18px 16px}.stone-list{grid-template-columns:1fr 1fr;gap:3px 6px}.pick-title{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">Stone Study</div><div class="score" id="score"></div></header><div class="track"><span id="progress"></span></div><h1>Poznej kámen</h1><p class="lead">Podívej se na vzorek a napiš jeho název latinkou.</p><section class="game">
<div class="setup" id="setup"><div class="setup-body"><h2>Co chceš procvičovat?</h2><label class="choice"><input type="radio" name="mode" value="all" checked><span>Všechny kameny (24)</span></label><label class="choice"><input type="radio" name="mode" value="selected"><span>Vybrat si kameny</span></label><div class="pick-panel" id="pickPanel" hidden><div class="pick-title"><span>Zaškrtni kameny k procvičování</span><div class="pick-actions"><button class="quiet" id="selectAll" type="button">Vybrat všechny</button><button class="quiet" id="selectNone" type="button">Odznačit</button></div></div><div class="stone-list" id="stoneList"></div></div><p class="error" id="setupError" aria-live="polite"></p><button class="start-button" id="begin" type="button">Začít procvičování</button></div></div>
<div id="quiz" hidden><article class="card" id="card"><div class="image-wrap"><img id="stone" alt="Fotografie vzorku kamene"></div><div class="body"><div class="label">Jak se tento kámen jmenuje?</div><form class="form" id="form"><input id="guess" type="text" autocomplete="off" placeholder="Název kamene…" aria-label="Název kamene"><button id="check">Zkontrolovat</button></form><div class="feedback" id="feedback" aria-live="polite"></div></div><div class="actions"><button class="quiet" id="skip" type="button">Nevím — ukázat odpověď</button><span class="hint">Enter — zkontrolovat</span></div></article><article class="card done" id="done" hidden><h2>Kolo dokončeno</h2><p>Správné odpovědi: <b id="finalScore"></b></p><button id="backToSetup" type="button">Vybrat jiné kameny</button></article><div class="foot">Pořadí se při každém kole náhodně mění</div></div></section></main><script>
const stones=[
['Ametyst','ametyst.png',['ametyst','amethyst']],['Chalkopyrit','chalkopyrit.png',['chalkopyrit','chalcopyrite','chalcopyrit']],['Fluorit','fluorit.png',['fluorit','fluorite']],['Grafit','grafit.png',['grafit','graphite']],['Granát','granat.png',['granat','garnet']],['Kalcit','kalcit.png',['kalcit','calcite']],['Křemen','kremen.png',['kremen','quartz']],['Krevel','krevel.png',['krevel','hematite']],['Magnetit','magnetit.png',['magnetit','magnetite']],['Mastek','mastek.png',['mastek','talc']],['Olivín','olivin.png',['olivin','olivine']],['Opál','opal.png',['opal']],['Ortoklas','ortoklas.png',['ortoklas','orthoclase']],['Plagioklas','plagioklas.png',['plagioklas','plagioclase']],['Pyrit','pyrit.png',['pyrit','pyrite']],['Růženín','ruzenin.png',['ruzenin','rose quartz','rosequartz']],['Sfalerit','sfalerit.png',['sfalerit','sphalerite']],['Siderit','siderit.png',['siderit','siderite']],['Síra','sira.png',['sira','sulfur','sulphur']],['Záhněda','zahned.png',['zahned(a)','zahned','smoky quartz','smokyquartz']],['Muskovit','muskovit.jpg',['muskovit','muscovite']],['Achát','achat.jpg',['achat','agate']],['Hnědel','hnedel.jpg',['hnedel','limonite']],['Galenit','galenit.png',['galenit','galena']]
];let deck=[],i=0,right=0,answered=false;const $=function(s){return document.querySelector(s)};function norm(x){return x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim()}function shuffle(list){for(let n=list.length-1;n>0;n--){const j=Math.floor(Math.random()*(n+1));[list[n],list[j]]=[list[j],list[n]]}return list}$('#stoneList').innerHTML=stones.map(function(s,n){return '<label class="stone-choice"><input class="stone-check" type="checkbox" value="'+n+'" checked><span>'+s[0]+'</span></label>'}).join('');document.querySelectorAll('input[name="mode"]').forEach(function(el){el.addEventListener('change',function(){$('#pickPanel').hidden=document.querySelector('input[name="mode"]:checked').value!=='selected';$('#setupError').textContent=''})});$('#selectAll').onclick=function(){document.querySelectorAll('.stone-check').forEach(function(x){x.checked=true})};$('#selectNone').onclick=function(){document.querySelectorAll('.stone-check').forEach(function(x){x.checked=false})};function start(){const mode=document.querySelector('input[name="mode"]:checked').value;const chosen=mode==='all'?stones.map(function(_,n){return n}):Array.from(document.querySelectorAll('.stone-check:checked'),function(x){return Number(x.value)});if(!chosen.length){$('#setupError').textContent='Vyber alespoň jeden kámen.';return}deck=shuffle(chosen.slice());i=0;right=0;answered=false;$('#score').textContent='';$('#progress').style.width='0%';$('#setup').hidden=true;$('#quiz').hidden=false;$('#card').hidden=false;$('#done').hidden=true;show()}function show(){answered=false;if(i>=deck.length){$('#progress').style.width='100%';$('#score').textContent=right+' / '+deck.length+' správně';$('#finalScore').textContent=right+' z '+deck.length;$('#card').hidden=true;$('#done').hidden=false;return}const s=stones[deck[i]];$('#stone').src='stones/'+s[1];$('#stone').alt='Vzorek: '+s[0];$('#guess').value='';$('#guess').disabled=false;$('#check').disabled=false;$('#feedback').textContent='';$('#score').textContent=right+' správně · '+(i+1)+' / '+deck.length;$('#progress').style.width=(i/deck.length*100)+'%';$('#guess').focus()}function reveal(correct,skipped){if(answered)return;answered=true;const s=stones[deck[i]];if(correct)right++;$('#feedback').innerHTML=skipped?'Odpověď: <span class="answer">'+s[0]+'</span>':correct?'<span class="ok">Správně! '+s[0]+'.</span>':'<span class="no">Špatně. Správná odpověď: <span class="answer">'+s[0]+'</span>.</span>';$('#guess').disabled=true;$('#check').disabled=true;$('#score').textContent=right+' správně · '+(i+1)+' / '+deck.length;setTimeout(function(){i++;show()},1600)}$('#begin').onclick=start;$('#backToSetup').onclick=function(){$('#quiz').hidden=true;$('#setup').hidden=false;$('#score').textContent='';$('#progress').style.width='0%'};$('#form').addEventListener('submit',function(e){e.preventDefault();if(answered)return;const s=stones[deck[i]],v=norm($('#guess').value);reveal(s[2].some(function(a){return norm(a)===v}),false)});$('#skip').onclick=function(){reveal(false,true)};
</script></body></html>
