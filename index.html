<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stone Study</title><style>
:root{--bg:#f5f3ed;--ink:#27281f;--muted:#77786d;--green:#4a614b;--line:#e5e1d7;--gold:#c89c55}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:880px;margin:auto;padding:30px 22px 55px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:13px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.score{font-size:13px;color:var(--muted)}.track{height:4px;background:#e6e2d8;border-radius:8px;margin:17px 0 32px;overflow:hidden}.track span{height:100%;display:block;background:#849277;width:0;transition:width .25s}h1{font:500 clamp(34px,6vw,48px)/1.1 Georgia,serif;letter-spacing:-.035em;margin:0 0 10px}.lead{margin:0;color:var(--muted)}.game{max-width:560px;margin:30px auto 0}.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 18px 44px #302d1d0d}.image-wrap{height:280px;background:#eee9dd;display:grid;place-items:center;padding:14px;overflow:hidden}.image-wrap img{width:auto;height:auto;max-width:360px;max-height:190px;object-fit:contain;border-radius:9px;transform:scale(1.3);image-rendering:auto}.body{padding:22px 24px 4px}.label{font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#999584}.form{display:flex;gap:10px;margin-top:12px}input{min-width:0;flex:1;padding:13px 14px;border:1px solid #d8d5ca;border-radius:10px;font:inherit;outline:0}input:focus{border-color:var(--green);box-shadow:0 0 0 3px #4a614b18}button{font:600 14px system-ui;cursor:pointer;border:0;border-radius:10px;background:var(--green);color:white;padding:0 19px}button:hover{background:#384d3a}button:disabled{opacity:.55;cursor:default}.feedback{min-height:50px;padding-top:13px;font-size:14px}.ok{color:#31704c}.no{color:#ad503b}.answer{font-weight:750;color:var(--ink)}.actions{padding:0 24px 20px;display:flex;align-items:center;justify-content:space-between}.quiet{background:none;color:var(--muted);padding:8px 0}.quiet:hover{background:none;color:var(--ink)}.hint{font-size:12px;color:#a4a195}.foot{text-align:center;color:#aaa696;font-size:12px;margin-top:17px}.done{text-align:center;padding:24px 12px 18px}.done h2{font:500 30px Georgia,serif;margin:0 0 7px}.done p{color:var(--muted);margin:0 0 18px}.done button{padding:13px 20px}@media(max-width:600px){.wrap{padding:22px 15px}.image-wrap{height:250px}.image-wrap img{max-width:300px;max-height:170px}.body{padding:18px 18px 3px}.actions{padding:0 18px 16px}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">Stone Study</div><div class="score" id="score"></div></header><div class="track"><span id="progress"></span></div><h1>Poznej kámen</h1><p class="lead">Podívej se na vzorek a napiš jeho název latinkou.</p><section class="game"><article class="card" id="card"><div class="image-wrap"><img id="stone" alt="Fotografie vzorku kamene"></div><div class="body"><div class="label">Jak se tento kámen jmenuje?</div><form class="form" id="form"><input id="guess" autocomplete="off" placeholder="Název kamene…" aria-label="Název kamene"><button id="check">Zkontrolovat</button></form><div class="feedback" id="feedback" aria-live="polite"></div></div><div class="actions"><button class="quiet" id="skip" type="button">Nevím — ukázat odpověď</button><span class="hint">Enter — zkontrolovat</span></div></article><div class="foot">24 vzorků · náhodné pořadí</div></section></main><script>
const stones=[
['Ametyst','ametyst.png',['ametyst','amethyst']],['Chalkopyrit','chalkopyrit.png',['chalkopyrit','chalcopyrite','chalcopyrit']],['Fluorit','fluorit.png',['fluorit','fluorite']],['Grafit','grafit.png',['grafit','graphite']],['Granát','granat.png',['granat','garnet']],['Kalcit','kalcit.png',['kalcit','calcite']],['Křemen','kremen.png',['kremen','quartz']],['Krevel','krevel.png',['krevel','hematite']],['Magnetit','magnetit.png',['magnetit','magnetite']],['Mastek','mastek.png',['mastek','talc']],['Olivín','olivin.png',['olivin','olivine']],['Opál','opal.png',['opal']],['Ortoklas','ortoklas.png',['ortoklas','orthoclase']],['Plagioklas','plagioklas.png',['plagioklas','plagioclase']],['Pyrit','pyrit.png',['pyrit','pyrite']],['Růženín','ruzenin.png',['ruzenin','rose quartz','rosequartz']],['Sfalerit','sfalerit.png',['sfalerit','sphalerite']],['Siderit','siderit.png',['siderit','siderite']],['Síra','sira.png',['sira','sulfur','sulphur']],['Záhněda','zahned.png',['zahned(a)','zahned','smoky quartz','smokyquartz']],['Muskovit','muskovit.jpg',['muskovit','muscovite']],['Achát','achat.jpg',['achat','agate']],['Hnědel','hnedel.jpg',['hnedel','limonite']],['Galenit','galenit.png',['galenit','galena']]
];let deck=[],i=0,right=0,answered=false;const $=s=>document.querySelector(s);function norm(x){return x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim()}function start(){deck=stones.map((_,n)=>n);for(let n=deck.length-1;n>0;n--){const j=Math.floor(Math.random()*(n+1));[deck[n],deck[j]]=[deck[j],deck[n]]}i=0;right=0;show()}function show(){answered=false;if(i>=deck.length){$('#progress').style.width='100%';$('#score').textContent=`${right} / ${stones.length} správně`; $("#card").innerHTML=`<div class="done"><h2>Kolo dokončeno</h2><p>Správné odpovědi: <b>${right} z ${stones.length}</b></p><button id="again">Zkusit znovu</button></div>`;$('#again').onclick=()=>location.reload();return}let s=stones[deck[i]];$('#stone').src='stones/'+s[1];$('#stone').alt='Vzorek: '+s[0];$('#guess').value='';$('#guess').disabled=false;$('#check').disabled=false;$('#feedback').textContent='';$('#score').textContent=`${right} správně · ${i+1} / ${stones.length}`;$('#progress').style.width=`${i/stones.length*100}%`;$('#guess').focus()}function reveal(correct,skipped=false){if(answered)return;answered=true;let s=stones[deck[i]];if(correct)right++;$('#feedback').innerHTML=skipped?`Odpověď: <span class="answer">${s[0]}</span>`:correct?'<span class="ok">Správně! '+s[0]+'.</span>':`<span class="no">Špatně. Správná odpověď: <span class="answer">${s[0]}</span>.</span>`;$('#guess').disabled=true;$('#check').disabled=true;$('#score').textContent=`${right} správně · ${i+1} / ${stones.length}`;setTimeout(()=>{i++;show()},1600)}$('#form').addEventListener('submit',e=>{e.preventDefault();if(answered)return;let s=stones[deck[i]],v=norm($('#guess').value);reveal(s[2].some(a=>norm(a)===v))});$('#skip').onclick=()=>reveal(false,true);start();
</script></body></html>
